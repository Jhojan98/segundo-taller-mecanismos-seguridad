name: ubicacion-compartida

services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-location_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mvp_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-location_mvp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./back
    container_name: mvp_backend
    env_file:
      # Si el archivo no existe, Compose continúa con los valores por defecto
      - path: .env
        required: false
    environment:
      # Conexión al servicio `postgres` (nombre de servicio de Docker, no localhost)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-location_mvp}
      # Base de pruebas independiente para `docker compose exec backend pytest`
      TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-location_mvp}_test
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mvp_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./front
    container_name: mvp_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mvp_net
    restart: unless-stopped

networks:
  mvp_net:
    driver: bridge

volumes:
  pgdata:
