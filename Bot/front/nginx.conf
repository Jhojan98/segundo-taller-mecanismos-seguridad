# Configuración de Nginx para el panel web (contenedor `frontend`).
# Sirve la compilación estática de Vite y hace de proxy hacia `backend:8000`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Evita cachear el HTML (permite desplegar cambios de inmediato)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos estáticos con caché larga (Vite incluye hash en los nombres)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy de la API REST hacia el servicio backend de Docker Compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier ruta se resuelve con index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
